# 放到 /opt/nginx-gateway/conf.d/imgkit.conf
# 前提：容器名 imgkit，已加入 nginx-gateway 同一 Docker 网络，监听 8787
# 证书沿用主站（需含 *.jiangbyte.cn 或单独签 imgkit.jiangbyte.cn）

server {
    listen 80;
    listen [::]:80;
    server_name imgkit.jiangbyte.cn;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name imgkit.jiangbyte.cn;

    ssl_certificate     /etc/nginx/certs/jiangbyte.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/jiangbyte.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 上传上限（服务端硬限 10MB，网关略放宽即可）
    client_max_body_size 12m;

    # 单进程同时托管前端与 /api，整站反代即可
    location / {
        proxy_pass http://imgkit:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
